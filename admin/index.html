<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Perla — Administration</title>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;1,300&family=Jost:wght@200;300;400&display=swap" rel="stylesheet" />
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    :root{--teal:#72AFA9;--charcoal:#1e2424;--cream:#f0ede8;--gold:#c8a96e}
    body{font-family:'Jost',sans-serif;background:var(--cream);min-height:100vh}
    #loginScreen{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
    .login-box{background:#fff;border-radius:4px;padding:48px 40px;max-width:400px;width:100%;text-align:center;box-shadow:0 4px 40px rgba(0,0,0,.08)}
    .login-logo{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;letter-spacing:.4em;color:var(--teal);margin-bottom:8px}
    .login-sub{font-size:.65rem;letter-spacing:.2em;text-transform:uppercase;color:#aaa;margin-bottom:32px}
    .login-input{width:100%;padding:13px 16px;border:1px solid #e0dbd4;border-radius:2px;font-size:.9rem;font-family:'Jost',sans-serif;margin-bottom:12px;outline:none;transition:border .2s}
    .login-input:focus{border-color:var(--teal)}
    .login-btn{width:100%;padding:14px;background:var(--teal);color:#fff;border:none;border-radius:2px;font-size:.72rem;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;transition:background .2s}
    .login-btn:hover{background:#5a9a94}
    .login-error{color:#c0392b;font-size:.8rem;margin-top:12px;display:none}
    #adminPanel{display:none}
    .admin-nav{background:var(--charcoal);padding:0 32px;display:flex;align-items:center;justify-content:space-between;height:56px}
    .admin-nav-logo{font-family:'Cormorant Garamond',serif;font-size:1.3rem;letter-spacing:.3em;color:var(--teal);font-weight:300}
    .admin-nav-right{display:flex;align-items:center;gap:16px}
    .admin-nav-site{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:#aaa;text-decoration:none;transition:color .2s}
    .admin-nav-site:hover{color:#fff}
    .admin-logout{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:#aaa;cursor:pointer;background:none;border:none;transition:color .2s}
    .admin-logout:hover{color:#fff}
    .admin-body{display:flex;min-height:calc(100vh - 56px)}
    .admin-sidebar{width:220px;background:#fff;border-right:1px solid #ede9e4;padding:24px 0;flex-shrink:0}
    .sidebar-section{font-size:.6rem;letter-spacing:.2em;text-transform:uppercase;color:#bbb;padding:16px 24px 8px}
    .sidebar-item{display:flex;align-items:center;gap:10px;padding:10px 24px;font-size:.82rem;color:var(--charcoal);cursor:pointer;transition:background .15s;border:none;background:none;width:100%;text-align:left}
    .sidebar-item:hover{background:#f8f5f0}
    .sidebar-item.active{background:#f0ede8;color:var(--teal);font-weight:400}
    .admin-main{flex:1;padding:32px;background:var(--cream);overflow-y:auto}
    .admin-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px}
    .admin-title{font-family:'Cormorant Garamond',serif;font-size:1.8rem;font-weight:300;color:var(--charcoal)}
    .btn-new{padding:10px 24px;background:var(--teal);color:#fff;border:none;border-radius:2px;font-size:.68rem;letter-spacing:.15em;text-transform:uppercase;cursor:pointer;transition:background .2s}
    .btn-new:hover{background:#5a9a94}
    .product-list{display:flex;flex-direction:column;gap:12px}
    .product-item{background:#fff;border-radius:3px;padding:16px 20px;display:flex;align-items:center;gap:16px;box-shadow:0 1px 4px rgba(0,0,0,.05);transition:box-shadow .2s}
    .product-item:hover{box-shadow:0 4px 16px rgba(0,0,0,.1)}
    .product-item-img{width:56px;height:56px;object-fit:cover;border-radius:2px;background:#f0ede8;flex-shrink:0}
    .product-item-info{flex:1}
    .product-item-name{font-size:.95rem;color:var(--charcoal);margin-bottom:4px}
    .product-item-meta{font-size:.72rem;color:#aaa}
    .product-item-badge{font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;padding:3px 8px;border-radius:20px;background:#f0ede8;color:var(--teal)}
    .product-item-actions{display:flex;gap:8px}
    .btn-edit{padding:6px 16px;background:none;border:1px solid var(--teal);color:var(--teal);border-radius:2px;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
    .btn-delete{padding:6px 16px;background:none;border:1px solid #e0dbd4;color:#aaa;border-radius:2px;font-size:.65rem;letter-spacing:.1em;text-transform:uppercase;cursor:pointer}
    .btn-delete:hover{border-color:#c0392b;color:#c0392b}
    .product-form{background:#fff;border-radius:3px;padding:32px;box-shadow:0 1px 4px rgba(0,0,0,.05);max-width:700px}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:16px}
    .form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
    .form-label{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:#aaa;font-weight:400}
    .form-input,.form-select,.form-textarea{padding:11px 14px;border:1px solid #e0dbd4;border-radius:2px;font-size:.88rem;font-family:'Jost',sans-serif;outline:none;transition:border .2s;background:#fff}
    .form-input:focus,.form-select:focus,.form-textarea:focus{border-color:var(--teal)}
    .form-textarea{min-height:80px;resize:vertical}
    .form-actions{display:flex;gap:12px;margin-top:24px}
    .btn-save{padding:12px 32px;background:var(--teal);color:#fff;border:none;border-radius:2px;font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;cursor:pointer}
    .btn-cancel{padding:12px 24px;background:none;border:1px solid #e0dbd4;color:#aaa;border-radius:2px;font-size:.72rem;letter-spacing:.15em;text-transform:uppercase;cursor:pointer}
    .photo-upload{border:2px dashed #e0dbd4;border-radius:3px;padding:32px;text-align:center;cursor:pointer;transition:border .2s}
    .photo-upload:hover{border-color:var(--teal)}
    .toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--charcoal);color:#fff;padding:12px 24px;border-radius:40px;font-size:.72rem;letter-spacing:.1em;opacity:0;transition:all .4s;pointer-events:none;z-index:999}
    .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
    .empty-state{text-align:center;padding:60px 0;color:#aaa}
    .empty-state p{font-family:'Cormorant Garamond',serif;font-size:1.3rem;font-style:italic}
    .stat-cards{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:28px}
    .stat-card{background:#fff;border-radius:3px;padding:20px 24px;box-shadow:0 1px 4px rgba(0,0,0,.05)}
    .stat-card-num{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:300;color:var(--teal)}
    .stat-card-label{font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:#aaa;margin-top:4px}
    .orders-table{width:100%;border-collapse:collapse;background:#fff;border-radius:3px;overflow:hidden;box-shadow:0 1px 4px rgba(0,0,0,.05)}
    .orders-table th{background:var(--charcoal);color:#fff;padding:12px 16px;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;font-weight:400;text-align:left}
    .orders-table td{padding:12px 16px;font-size:.82rem;color:var(--charcoal);border-bottom:1px solid #f0ede8}
    .orders-table tr:hover td{background:#faf8f5}
    .status-badge{display:inline-block;padding:3px 10px;border-radius:20px;font-size:.6rem;letter-spacing:.1em;text-transform:uppercase}
    .status-attente{background:#fef3cd;color:#856404}
    .status-confirme{background:#d1e7dd;color:#155724}
    .status-livre{background:#cff4fc;color:#0c5460}
    @media(max-width:768px){
      .admin-sidebar{display:none}
      .form-row{grid-template-columns:1fr}
      .stat-cards{grid-template-columns:1fr}
    }
  </style>
</head>
<body>

<!-- LOGIN -->
<div id="loginScreen">
  <div class="login-box">
    <div class="login-logo">PERLA</div>
    <div class="login-sub">Administration</div>
    <input type="password" class="login-input" id="loginPassword"
      placeholder="Mot de passe" onkeydown="if(event.key==='Enter')doLogin()" />
    <button class="login-btn" onclick="doLogin()">Se connecter</button>
    <div class="login-error" id="loginError">Mot de passe incorrect.</div>
  </div>
</div>

<!-- ADMIN PANEL -->
<div id="adminPanel">
  <nav class="admin-nav">
    <div class="admin-nav-logo">PERLA</div>
    <div class="admin-nav-right">
      <a href="/" target="_blank" class="admin-nav-site">← Voir le site</a>
      <button class="admin-logout" onclick="doLogout()">Déconnexion</button>
    </div>
  </nav>
  <div class="admin-body">
    <aside class="admin-sidebar">
      <div class="sidebar-section">Tableau de bord</div>
      <button class="sidebar-item active" id="sideProducts" onclick="showSection('products',this)">🛍 Produits</button>
      <button class="sidebar-item" id="sideOrders" onclick="showSection('orders',this)">📦 Commandes</button>
    </aside>
    <main class="admin-main" id="adminMain"></main>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ════════════════════════════════════
   CONFIG
════════════════════════════════════ */
const PASSWORD  = 'Nadia$Perla*2026';
const SHEETS_API = 'https://script.google.com/macros/s/AKfycbw4A59eT2dvLl8G0rk751Y89-FIWqdrx-Romj5qETWR6Z1i_KIrpeJ-8VkqQ-fH4BOZ/exec';
const GITHUB_TOKEN = localStorage.getItem('perla_gh_token') || '';
const REPO = 'darkouchzak-rgb/Perla-v2';
const BRANCH = 'main';

/* ════════════════════════════════════
   AUTH
════════════════════════════════════ */
function doLogin() {
  const pw = document.getElementById('loginPassword').value;
  if (pw === PASSWORD) {
    sessionStorage.setItem('perla_admin','1');
    document.getElementById('loginScreen').style.display = 'none';
    document.getElementById('adminPanel').style.display  = 'block';
    // Check if token is stored
    if (!localStorage.getItem('perla_gh_token')) {
      showTokenSetup();
    } else {
      showSection('products', document.getElementById('sideProducts'));
    }
  } else {
    const err = document.getElementById('loginError');
    err.style.display = 'block';
    setTimeout(() => err.style.display = 'none', 2000);
  }
}

function doLogout() {
  sessionStorage.removeItem('perla_admin');
  location.reload();
}

/* ════════════════════════════════════
   API CALLS TO GOOGLE SHEETS
════════════════════════════════════ */
async function sheetsGet(action) {
  const r = await fetch(`${SHEETS_API}?action=${action}`);
  return r.json();
}

async function sheetsPost(data) {
  const r = await fetch(SHEETS_API, {
    method: 'POST',
    mode: 'no-cors',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(data)
  });
  return { success: true };
}

/* ════════════════════════════════════
   IMAGE UPLOAD TO GITHUB
════════════════════════════════════ */
/* ── CLOUDINARY UPLOAD ── */
const CLOUD_NAME    = 'dfqudqdnj';
const UPLOAD_PRESET = 'hob9hl5b';

async function uploadImage(file) {
  const fd = new FormData();
  fd.append('file', file);
  fd.append('upload_preset', UPLOAD_PRESET);
  fd.append('folder', 'perla-products');
  const res  = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, {
    method: 'POST', body: fd
  });
  const data = await res.json();
  if (!data.secure_url) throw new Error('Cloudinary upload failed: ' + JSON.stringify(data));
  return data.secure_url;
}

/* ════════════════════════════════════
   SECTIONS
════════════════════════════════════ */
function showTokenSetup() {
  document.getElementById('adminMain').innerHTML = `
    <div class="admin-header"><h1 class="admin-title">⚙️ Configuration initiale</h1></div>
    <div class="product-form" style="max-width:500px">
      <p style="font-size:.88rem;color:#aaa;line-height:1.8;margin-bottom:24px">
        Configuration unique — entrez votre GitHub Token pour activer l'upload de photos.<br/>
        Ce token est stocké uniquement sur votre appareil.
      </p>
      <div class="form-group">
        <label class="form-label">GitHub Personal Access Token</label>
        <input type="password" class="form-input" id="ghTokenInput" placeholder="ghp_xxxxxxxxxxxx" />
      </div>
      <button class="btn-save" onclick="saveGhToken()">Enregistrer et continuer</button>
    </div>`;
}

function saveGhToken() {
  const t = document.getElementById('ghTokenInput').value.trim();
  if (!t) return;
  localStorage.setItem('perla_gh_token', t);
  showToast('Token enregistré !');
  showSection('products', document.getElementById('sideProducts'));
}

function showSection(section, btn) {
  document.querySelectorAll('.sidebar-item').forEach(b => b.classList.remove('active'));
  if (btn) btn.classList.add('active');
  if (section === 'products') showProducts();
  if (section === 'orders')   showOrders();
}

/* ════════════════════════════════════
   PRODUCTS
════════════════════════════════════ */
async function showProducts() {
  const main = document.getElementById('adminMain');
  main.innerHTML = `
    <div class="admin-header">
      <h1 class="admin-title">🛍 Produits</h1>
      <button class="btn-new" onclick="showForm(null)">+ Nouveau produit</button>
    </div>
    <p style="color:#aaa;font-size:.85rem">Chargement depuis Google Sheets…</p>`;

  let products = [];
  try {
    products = await sheetsGet('getProducts');
  } catch(e) {
    main.innerHTML += `<p style="color:#c0392b">Erreur de connexion à Google Sheets.</p>`;
    return;
  }

  if (!Array.isArray(products) || products.length === 0) {
    main.innerHTML = `
      <div class="admin-header">
        <h1 class="admin-title">🛍 Produits</h1>
        <button class="btn-new" onclick="showForm(null)">+ Nouveau produit</button>
      </div>
      <div class="empty-state"><p>Aucun produit pour le moment.</p><br/>
        <button class="btn-new" onclick="showForm(null)">+ Ajouter le premier produit</button>
      </div>`;
    return;
  }

  const list = products.map(p => `
    <div class="product-item">
      <img src="${p.image||p.image_url||''}" class="product-item-img" onerror="this.style.background='#f0ede8'" />
      <div class="product-item-info">
        <div class="product-item-name">${p.name}</div>
        <div class="product-item-meta">${p.genre||''} · ${p.category||''} · ${p.price||''}</div>
      </div>
      ${p.badge ? `<span class="product-item-badge">${p.badge}</span>` : ''}
      <div class="product-item-actions">
        <button class="btn-edit" onclick='showForm(${JSON.stringify(p).replace(/'/g,"&#39;")})'>Modifier</button>
        <button class="btn-delete" onclick='delProduct(${JSON.stringify(p).replace(/'/g,"&#39;")})'>Supprimer</button>
      </div>
    </div>`).join('');

  main.innerHTML = `
    <div class="admin-header">
      <h1 class="admin-title">🛍 Produits <span style="font-size:1rem;color:#aaa;font-family:'Jost'">(${products.length})</span></h1>
      <button class="btn-new" onclick="showForm(null)">+ Nouveau produit</button>
    </div>
    <div class="product-list">${list}</div>`;
}

/* ── PHOTO SLOTS ── */
let photoUrls = ['','','','','',''];

function initPhotoSlots(existing) {
  photoUrls = [
    existing.image  || '',
    existing.image2 || '',
    existing.image3 || '',
    existing.image4 || '',
    existing.image5 || '',
    existing.image6 || '',
  ];
  renderPhotoSlots();
}

function renderPhotoSlots() {
  const container = document.getElementById('photoSlotsContainer');
  if (!container) return;
  const labels = ['Photo principale ★','Photo 2','Photo 3','Photo 4','Photo 5','Photo 6'];
  container.innerHTML = `
    <div style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px">
      ${photoUrls.map((url, i) => `
        <div style="position:relative;aspect-ratio:1;border:2px dashed ${url ? '#72AFA9' : '#e0dbd4'};border-radius:3px;overflow:hidden;cursor:pointer;background:#faf8f5;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:4px"
          onclick="document.getElementById('slotInput${i}').click()">
          <input type="file" id="slotInput${i}" accept="image/*" style="display:none"
            onchange="handleSlot(${i}, this)" />
          ${url
            ? `<img src="${url}" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover" />
               <button onclick="event.stopPropagation();removeSlot(${i})"
                 style="position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;background:rgba(192,57,43,.9);color:white;border:none;cursor:pointer;font-size:10px;display:flex;align-items:center;justify-content:center;z-index:2">✕</button>`
            : `<div style="font-size:1.4rem;opacity:.3">📷</div>
               <div style="font-size:.6rem;letter-spacing:.1em;text-transform:uppercase;color:#bbb">${labels[i]}</div>`
          }
        </div>`).join('')}
    </div>`;
}

async function handleSlot(i, input) {
  const file = input.files[0];
  if (!file) return;
  /* Show preview immediately */
  const reader = new FileReader();
  reader.onload = e => {
    photoUrls[i] = e.target.result; /* temp preview */
    renderPhotoSlots();
  };
  reader.readAsDataURL(file);
}

function removeSlot(i) {
  photoUrls[i] = '';
  renderPhotoSlots();
}

function showForm(p) {
  const isNew = !p;
  p = p || { name:'',price:'',genre:'Femme',category:'Bagues',collection:'Lumière',description:'',material:'',image:'',available:true,badge:'',order:99,slug:'',sizes:'' };
  document.getElementById('adminMain').innerHTML = `
    <div class="admin-header">
      <h1 class="admin-title">${isNew ? 'Nouveau produit' : 'Modifier le produit'}</h1>
    </div>
    <div class="product-form">
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Nom du produit *</label>
          <input class="form-input" id="fName" value="${p.name||''}" placeholder="Ex: Boucles Soleil" />
        </div>
        <div class="form-group">
          <label class="form-label">Prix *</label>
          <input class="form-input" id="fPrice" value="${p.price||''}" placeholder="Ex: 349 MAD" />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Genre *</label>
          <select class="form-select" id="fGenre">
            <option value="Femme" ${(p.genre||'')==='Femme'?'selected':''}>👩 Femme</option>
            <option value="Homme" ${(p.genre||'')==='Homme'?'selected':''}>👨 Homme</option>
            <option value="Les deux" ${(p.genre||'')==='Les deux'?'selected':''}>👫 Les deux</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Catégorie *</label>
          <select class="form-select" id="fCategory" onchange="toggleSizes(this.value)">
            <option value="Bagues" ${(p.category||'')==='Bagues'?'selected':''}>Bagues</option>
            <option value="Colliers" ${(p.category||'')==='Colliers'?'selected':''}>Colliers</option>
            <option value="Bracelets" ${(p.category||'')==='Bracelets'?'selected':''}>Bracelets</option>
            <option value="Boucles d'oreilles" ${(p.category||'')==="Boucles d'oreilles"?'selected':''}>Boucles d'oreilles</option>
            <option value="Manchettes" ${(p.category||'')==='Manchettes'?'selected':''}>Manchettes</option>
            <option value="Chaîne de pieds" ${(p.category||'')==='Chaîne de pieds'?'selected':''}>Chaîne de pieds (Khelkhal)</option>
            <option value="Ensemble" ${(p.category||'')==='Ensemble'?'selected':''}>Ensemble</option>
            <option value="Broches" ${(p.category||'')==='Broches'?'selected':''}>Broches</option>
            <option value="Piercings" ${(p.category||'')==='Piercings'?'selected':''}>Piercings</option>
          </select>
        </div>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Collection</label>
          <select class="form-select" id="fCollection">
            <option value="Lumière" ${(p.collection||'')==='Lumière'?'selected':''}>Lumière</option>
            <option value="Perles" ${(p.collection||'')==='Perles'?'selected':''}>Perles</option>
            <option value="Éclipse" ${(p.collection||'')==='Éclipse'?'selected':''}>Éclipse</option>
            <option value="Minuit" ${(p.collection||'')==='Minuit'?'selected':''}>Minuit</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label">Badge</label>
          <select class="form-select" id="fBadge">
            <option value="" ${!p.badge?'selected':''}>Aucun</option>
            <option value="Nouvelle Saison" ${(p.badge||'')==='Nouvelle Saison'?'selected':''}>Nouvelle Saison</option>
            <option value="Signature" ${(p.badge||'')==='Signature'?'selected':''}>Signature</option>
            <option value="Édition Limitée" ${(p.badge||'')==='Édition Limitée'?'selected':''}>Édition Limitée</option>
            <option value="Best-seller" ${(p.badge||'')==='Best-seller'?'selected':''}>Best-seller</option>
          </select>
        </div>
      </div>
      <div class="form-group">
        <label class="form-label">Matière</label>
        <input class="form-input" id="fMaterial" value="${p.material||''}" placeholder="Ex: Or 18k · Perle naturelle" />
      </div>
      <div class="form-group" id="sizesGroup" style="display:${(p.category||'')==='Bagues'?'flex':'none'};flex-direction:column">
        <label class="form-label">Tailles disponibles (Bagues)</label>
        <div style="display:flex;flex-wrap:wrap;gap:8px;margin-top:4px" id="sizesCheckboxes">
          ${['6','7','8','9','10'].map(s => {
            const sizes = (p.sizes||'').split(',').map(x=>x.trim());
            const checked = sizes.includes(s) ? 'checked' : '';
            const bg = checked ? 'var(--teal)' : '#fff';
            const col = checked ? '#fff' : '#555';
            return '<label style="display:flex;align-items:center;gap:4px;font-size:.85rem;cursor:pointer;padding:6px 14px;border:1.5px solid #e0dbd4;border-radius:20px;background:'+bg+';color:'+col+';transition:all .2s">'
              + '<input type="checkbox" value="'+s+'" name="size" '+checked+' style="display:none" onchange="updateSizeLabel(this)">'
              + s + '</label>';
          }).join('')}
        </div>
        <p style="font-size:.68rem;color:#aaa;margin-top:6px">Cochez les tailles disponibles en stock</p>
      </div>
      <div class="form-group">
        <label class="form-label">Description</label>
        <textarea class="form-textarea" id="fDescription">${p.description||''}</textarea>
      </div>
      <div class="form-group">
        <label class="form-label">Photos du produit (jusqu'à 6)</label>
        <div id="photoSlotsContainer"></div>
        <p style="font-size:.7rem;color:#aaa;margin-top:6px">Cliquez sur une case · Photo 1 = photo principale</p>
      </div>
      <div class="form-row">
        <div class="form-group">
          <label class="form-label">Ordre d'affichage</label>
          <input type="number" class="form-input" id="fOrder" value="${p.order||99}" />
        </div>
        <div class="form-group">
          <label class="form-label">Disponible</label>
          <select class="form-select" id="fAvailable">
            <option value="true" ${p.available!==false?'selected':''}>Oui ✓</option>
            <option value="false" ${p.available===false?'selected':''}>Non ✗</option>
          </select>
        </div>
      </div>
      <div class="form-actions">
        <button class="btn-save" id="btnSave" onclick='saveForm(${JSON.stringify(isNew)},${JSON.stringify(p)})'>
          ${isNew ? '✓ Publier le produit' : '✓ Enregistrer les modifications'}
        </button>
        <button class="btn-cancel" onclick="showProducts()">Annuler</button>
      </div>
    </div>`;
  /* Init photo slots AFTER DOM is written */
  initPhotoSlots(p);
  toggleSizes(p.category || '');
}

function previewPhoto(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    document.getElementById('photoPreview').innerHTML =
      `<img src="${e.target.result}" style="max-height:180px;width:100%;object-fit:cover;border-radius:2px" />`;
  };
  reader.readAsDataURL(file);
}

async function saveForm(isNew, original) {
  const name  = document.getElementById('fName').value.trim();
  const price = document.getElementById('fPrice').value.trim();
  if (!name || !price) { showToast('Nom et prix requis !'); return; }

  const btn = document.getElementById('btnSave');
  btn.textContent = 'Sauvegarde…';
  btn.disabled = true;

  /* Upload any pending photos */
  showToast('Vérification des photos…');
  for (let i = 0; i < 6; i++) {
    const input = document.getElementById('slotInput' + i);
    if (input && input.files[0]) {
      showToast('Upload photo ' + (i+1) + '…');
      try {
        photoUrls[i] = await uploadImage(input.files[0]);
      } catch(e) {
        showToast('Erreur upload photo ' + (i+1));
      }
    }
  }
  const image = photoUrls[0] || '';
  const checkedSizes = [...document.querySelectorAll('#sizesCheckboxes input[type=checkbox]:checked')].map(cb => cb.value);
  const sizes = checkedSizes.join(', ');

  const slug = name.toLowerCase().replace(/\s+/g,'-').replace(/[^a-z0-9-]/g,'');
  const product = {
    name, price, slug, image,
    image2:      photoUrls[1] || '',
    image3:      photoUrls[2] || '',
    image4:      photoUrls[3] || '',
    image5:      photoUrls[4] || '',
    image6:      photoUrls[5] || '',
    genre:       document.getElementById('fGenre').value,
    category:    document.getElementById('fCategory').value,
    collection:  document.getElementById('fCollection').value,
    badge:       document.getElementById('fBadge').value,
    material:    document.getElementById('fMaterial').value,
    description: document.getElementById('fDescription').value,
    available:   document.getElementById('fAvailable').value === 'true',
    sizes:       sizes,
    featured:    false,
    order:       parseInt(document.getElementById('fOrder').value) || 99,
    action:      isNew ? 'saveProduct' : 'updateProduct',
    _row:        original._row || null,
  };

  try {
    await sheetsPost(product);
    showToast(isNew ? '✓ Produit ajouté dans Google Sheets !' : '✓ Produit modifié !');
    setTimeout(() => showProducts(), 1500);
  } catch(e) {
    showToast('Erreur — réessayez');
    btn.textContent = isNew ? '✓ Publier' : '✓ Enregistrer';
    btn.disabled = false;
  }
}

async function delProduct(p) {
  if (!confirm(`Supprimer "${p.name}" ?`)) return;
  await sheetsPost({ action: 'deleteProduct', _row: p._row });
  showToast('Produit supprimé');
  showProducts();
}

/* ════════════════════════════════════
   ORDERS
════════════════════════════════════ */
async function showOrders() {
  const main = document.getElementById('adminMain');
  main.innerHTML = `
    <div class="admin-header"><h1 class="admin-title">📦 Commandes</h1></div>
    <p style="color:#aaa;font-size:.85rem">Chargement depuis Google Sheets…</p>`;

  let orders = [];
  let ordersError = '';
  try {
    const raw = await sheetsGet('getOrders');
    if (Array.isArray(raw)) {
      orders = raw;
    } else if (raw && raw.error) {
      ordersError = raw.error;
    } else {
      ordersError = 'Réponse inattendue: ' + JSON.stringify(raw).slice(0,100);
    }
  } catch(e) {
    ordersError = e.message;
  }

  if (!orders.length) {
    main.innerHTML = `
      <div class="admin-header"><h1 class="admin-title">📦 Commandes</h1></div>
      <div class="empty-state">
        <p>Aucune commande pour le moment.</p>
        ${ordersError ? `<p style="color:#c0392b;font-size:.75rem;margin-top:8px">Erreur: ${ordersError}</p>` : ''}
        <p style="font-size:.72rem;color:#aaa;margin-top:8px">
          ⚠️ Si vous avez des commandes dans Google Sheets, vérifiez que le script Apps Script a été mis à jour avec la version v2 (qui inclut getOrders).
        </p>
      </div>`;
    return;
  }

  const rows = orders.map(o => `
    <tr>
      <td>${o.date||''}</td>
      <td><strong>${o.nom||''}</strong><br/><small style="color:#aaa">${o.telephone||''}</small></td>
      <td>${o.ville||''}</td>
      <td>${o.produits||''}</td>
      <td><strong>${o.total||''}</strong></td>
      <td><span class="status-badge status-attente">${o.statut||'En attente'}</span></td>
    </tr>`).join('');

  main.innerHTML = `
    <div class="admin-header">
      <h1 class="admin-title">📦 Commandes <span style="font-size:1rem;color:#aaa;font-family:'Jost'">(${orders.length})</span></h1>
      <a href="https://docs.google.com/spreadsheets/d/1EXSG9HT0skcGoyiY3MaOHM1wQsLclhSuWVZdxXh74Ok" target="_blank" class="btn-new" style="text-decoration:none">
        Ouvrir Google Sheets →
      </a>
    </div>
    <table class="orders-table">
      <thead><tr><th>Date</th><th>Client</th><th>Ville</th><th>Produits</th><th>Total</th><th>Statut</th></tr></thead>
      <tbody>${rows}</tbody>
    </table>`;
}

function toggleSizes(category) {
  const group = document.getElementById('sizesGroup');
  if (group) group.style.display = category === 'Bagues' ? 'flex' : 'none';
}

function updateSizeLabel(cb) {
  const label = cb.parentElement;
  if (cb.checked) {
    label.style.background = 'var(--teal)';
    label.style.color = '#fff';
    label.style.borderColor = 'var(--teal)';
  } else {
    label.style.background = '#fff';
    label.style.color = '#555';
    label.style.borderColor = '#e0dbd4';
  }
}

function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(() => t.classList.remove('show'), 3000);
}
