<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Produit — Perla Accessories</title>
  <meta name="description" content="Découvrez ce bijou Perla — qualité premium, livraison au Maroc." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="pages.css" />
</head>
<body data-page="product-detail">

  <main class="product-detail" id="productDetailContainer">
    <p style="grid-column:1/-1;text-align:center;padding:100px 0;color:var(--charcoal-40);">Chargement des détails du produit…</p>
  </main>

  <script>
    const PRODUCTS_BACKUP = [
      { slug:'collier-lumiere', name:'Collier Lumière', price:'450 MAD', collection:'Lumière', category:'Colliers', genre:'Femme', material:'Vermeil Or 18k · Zircon', image:'images/femme-product1.jpg', description:'Un jonc architectural épuré.' },
      { slug:'bague-perle-solitaire', name:'Bague Perle Solitaire', price:'320 MAD', collection:'Perles', category:'Bagues', genre:'Femme', material:"Argent 925 · Perle d'eau douce", image:'images/femme-product2.jpg', description:'Une perle fine montée sur jonc.' },
      { slug:'jonc-eclipse', name:'Jonc Éclipse', price:'580 MAD', collection:'Éclipse', category:'Bracelets', genre:'Femme', material:'Or 18k recyclé', image:'images/femme-product3.jpg', description:'Le minimalisme à l\'état pur.' }
    ];

    async function loadProduct() {
      const slug = new URLSearchParams(window.location.search).get('slug');
      let product = PRODUCTS_BACKUP.find(p => p.slug === slug);

      try {
        const res = await fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vT_p_5S0O2g_6wI8ePscVdOidwR6N5Mv_C_t07A7FhB_B98n_l7W_65z0rGvN9p_X3A/pub?output=csv');
        if(res.ok) {
          const text = await res.text();
          const lines = text.split('\n').map(l => l.split(','));
          const headers = lines[0].map(h => h.trim().toLowerCase());
          const match = lines.slice(1).map(row => {
            let item = {};
            headers.forEach((h, i) => { item[h] = row[i]?.trim(); });
            return item;
          }).find(p => p.slug === slug);

          if(match) {
            product = {
              name: match.name,
              price: match.price,
              collection: match.collection,
              material: match.material,
              description: match.description || 'Chaque pièce Perla incarne un luxe discret et intemporel, façonné avec passion pour accompagner votre quotidien avec élégance.',
              image: match.image ? match.image.replace(/^\//, '') : 'images/femme-product1.jpg'
            };
          }
        }
      } catch(e) {}

      const container = document.getElementById('productDetailContainer');
      if(!product) {
        container.innerHTML = `<p style="grid-column:1/-1;text-align:center;padding:100px 0;">Produit introuvable. <a href="products.html" style="text-decoration:underline;">Retour au catalogue</a></p>`;
        return;
      }

      container.innerHTML = `
        <div class="product-gallery">
          <div class="main-image-wrapper">
            <img src="${product.image}" alt="${product.name}" class="product-main-img" />
          </div>
        </div>
        <div class="product-info-panel">
          <a href="products.html" class="back-link">← Retour au catalogue</a>
          <div class="product-meta-top">${product.collection} · Premium</div>
          <h1 class="product-title-heading">${product.name}</h1>
          <div class="product-price-tag">${product.price}</div>
          <div class="product-description-text"><p>${product.description}</p></div>
          <div class="specs-table">
            <div class="spec-row"><span>Matériaux</span><span>${product.material || 'Argent / Vermeil'}</span></div>
            <div class="spec-row"><span>Disponibilité</span><span>Sur commande (Livrable partout au Maroc)</span></div>
          </div>
          <a href="https://wa.me/212660055928?text=Bonjour Perla, je souhaite commander l'article suivant : ${product.name} (${product.price})" target="_blank" class="buy-whatsapp-btn">
            Commander via WhatsApp
          </a>
        </div>`;
    }
    document.addEventListener('DOMContentLoaded', loadProduct);
  </script>
</body>
</html>
