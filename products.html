<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catalogue — Perla Accessories</title>
  <meta name="description" content="Découvrez nos collections de bijoux Femme et Homme — Perla Accessories." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="style.css" />
  <link rel="stylesheet" href="pages.css" />
</head>
<body data-page="products.html">

  <div class="page-hero">
    <img src="images/hero.jpg" alt="Catalogue Perla" class="page-hero-img" />
    <div class="page-hero-overlay"></div>
    <div class="page-hero-content">
      <div class="page-hero-label">Collections</div>
      <h1>Notre <em>Catalogue</em></h1>
    </div>
  </div>

  <section class="gender-view-section" id="genderViewSection">
    <div class="gender-grid">
      <div class="gender-card" onclick="showGender('Femme')">
        <img src="images/femme-product1.jpg" alt="Collection Femme" />
        <div class="gender-card-overlay"></div>
        <div class="gender-card-content">
          <span>Découvrir</span>
          <h2>Pour Elle</h2>
        </div>
      </div>
      <div class="gender-card" onclick="showGender('Homme')">
        <img src="images/homme-instagram1.jpg" alt="Collection Homme" />
        <div class="gender-card-overlay"></div>
        <div class="gender-card-content">
          <span>Découvrir</span>
          <h2>Pour Lui</h2>
        </div>
      </div>
    </div>
  </section>

  <div id="catalogWorkspace" style="display:none;">
    <div class="catalog-container">
      <aside class="catalog-sidebar">
        <button class="back-to-gender" onclick="resetToGenderView()">
          ← Retour aux univers
        </button>
        <div class="active-universe-indicator">
          <span>Univers</span>
          <h2 id="sidebarUniverseTitle">Femme</h2>
        </div>
        <div class="filter-group">
          <h3>Catégories</h3>
          <div class="filter-buttons" id="categoryFilter"></div>
        </div>
        <div class="filter-group">
          <h3>Collections</h3>
          <div class="filter-buttons" id="collectionFilter"></div>
        </div>
      </aside>

      <main class="catalog-content">
        <div class="catalog-toolbar">
          <div class="results-count" id="resultsCount">0 produits</div>
        </div>
        <div class="product-grid" id="productGrid"></div>
      </main>
    </div>
  </div>

  <script>
    const urlParams = new URLSearchParams(window.location.search);
    let urlGenre = urlParams.get('genre');
    let urlCat = urlParams.get('category');
    let urlColl = urlParams.get('collection');

    let currentGenre = null;
    let currentCategory = 'Tous';
    let currentCollection = 'Tous';

    let PRODUCTS = [
      { slug:'collier-lumiere', name:'Collier Lumière', price:'450 MAD', collection:'Lumière', category:'Colliers', genre:'Femme', material:'Vermeil Or 18k · Zircon', image:'images/femme-product1.jpg', available:true, badge:'Nouvelle Saison' },
      { slug:'bague-perle-solitaire', name:'Bague Perle Solitaire', price:'320 MAD', collection:'Perles', category:'Bagues', genre:'Femme', material: "Argent 925 · Perle d'eau douce", image:'images/femme-product2.jpg', available:true, badge:'Signature' },
      { slug:'jonc-eclipse', name:'Jonc Éclipse', price:'580 MAD', collection:'Éclipse', category:'Bracelets', genre:'Femme', material:'Or 18k recyclé', image:'images/femme-product3.jpg', available:true, badge:'Édition Limitée' },
      { slug:'boucles-minuit', name:'Boucles d\'oreilles Minuit', price:'390 MAD', collection:'Minuit', category:"Boucles d'oreilles", genre:'Les deux', material:'Onyx noir · Argent oxydé', image:'images/femme-product4.jpg', available:true, badge:'Best-seller' }
    ];

    async function loadProductsFromSheets() {
      try {
        const res = await fetch('https://docs.google.com/spreadsheets/d/e/2PACX-1vT_p_5S0O2g_6wI8ePscVdOidwR6N5Mv_C_t07A7FhB_B98n_l7W_65z0rGvN9p_X3A/pub?output=csv');
        if(!res.ok) return;
        const text = await res.text();
        const lines = text.split('\n').map(l => l.split(','));
        const headers = lines[0].map(h => h.trim().toLowerCase());
        
        const rawProducts = lines.slice(1).map(row => {
          let item = {};
          headers.forEach((h, i) => { item[h] = row[i]?.trim(); });
          return item;
        }).filter(p => p.slug);

        if(rawProducts.length > 0) {
          PRODUCTS = rawProducts.map(p => ({
            slug: p.slug,
            name: p.name || 'Bijou Perla',
            price: p.price || 'Sur demande',
            collection: p.collection || 'Signature',
            category: p.category || 'Autres',
            genre: p.genre || 'Femme',
            material: p.material || '',
            image: p.image ? p.image.replace(/^\//, '') : (p.genre === 'Homme' ? 'images/homme-product6.jpg' : 'images/femme-product1.jpg'),
            available: p.available !== false && p.available !== 'false',
            badge: p.badge || ''
          }));
        }
      } catch(e) {}
    }

    function renderGrid(container, items) {
      if(items.length === 0) {
        container.innerHTML = `<p style="grid-column:1/-1;padding:40px 0;color:var(--charcoal-40);">Aucun produit ne correspond à ces critères.</p>`;
        document.getElementById('resultsCount').textContent = "0 produit";
        return;
      }
      document.getElementById('resultsCount').textContent = `${items.length} ${items.length > 1 ? 'produits' : 'produit'}`;
      container.innerHTML = items.map(p => `
        <a href="product.html?slug=${p.slug}" class="product-card">
          <div class="p-card-media">
            <img src="${p.image}" alt="${p.name}" class="p-card-img" />
            ${p.badge ? `<span class="p-card-badge">${p.badge}</span>` : ''}
          </div>
          <div class="p-card-info">
            <div class="p-card-meta">${p.collection} · ${p.material}</div>
            <h3 class="p-card-title">${p.name}</h3>
            <div class="p-card-price">${p.price}</div>
          </div>
        </a>`).join('');
    }

    function buildFilters(items) {
      const cats = ['Tous', ...new Set(items.map(p => p.category))];
      const colls = ['Tous', ...new Set(items.map(p => p.collection))];
      
      document.getElementById('categoryFilter').innerHTML = cats.map(c => `
        <button class="filter-btn ${c===currentCategory?'active':''}" onclick="filterCategory('${c}')">${c}</button>`).join('');
      document.getElementById('collectionFilter').innerHTML = colls.map(c => `
        <button class="filter-btn ${c===currentCollection?'active':''}" onclick="filterCollection('${c}')">${c}</button>`).join('');
    }

    function showGender(genre) {
      currentGenre = genre;
      currentCategory = 'Tous';
      currentCollection = 'Tous';
      document.getElementById('genderViewSection').style.display = 'none';
      document.getElementById('catalogWorkspace').style.display = 'block';
      document.getElementById('sidebarUniverseTitle').textContent = genre === 'Homme' ? 'Pour Lui' : 'Pour Elle';
      applyFilters();
    }

    function resetToGenderView() {
      currentGenre = null;
      document.getElementById('catalogWorkspace').style.display = 'none';
      document.getElementById('genderViewSection').style.display = 'block';
    }

    function filterCategory(cat) { currentCategory = cat; applyFilters(); }
    function filterCollection(coll) { currentCollection = coll; applyFilters(); }

    function applyFilters() {
      let filtered = PRODUCTS.filter(p => p.genre === currentGenre || p.genre === 'Les deux');
      buildFilters(filtered);
      if(currentCategory !== 'Tous') filtered = filtered.filter(p => p.category === currentCategory);
      if(currentCollection !== 'Tous') filtered = filtered.filter(p => p.collection === currentCollection);
      renderGrid(document.getElementById('productGrid'), filtered);
    }

    document.addEventListener('DOMContentLoaded', async () => {
      const grid = document.getElementById('productGrid');
      grid.innerHTML = '<p style="grid-column:1/-1;padding:40px;color:var(--charcoal-40);">Chargement des produits…</p>';
      await loadProductsFromSheets();
      if(urlGenre) {
        showGender(urlGenre);
        if(urlCat) filterCategory(urlCat);
        if(urlColl) filterCollection(urlColl);
      } else {
        resetToGenderView();
      }
    });
  </script>
</body>
</html>
