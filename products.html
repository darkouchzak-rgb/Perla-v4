<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Catalogue — Perla Accessories</title>
  <meta name="description" content="Découvrez nos collections de bijoux Femme et Homme — Perla Accessories." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300;1,400&family=Jost:wght@200;300;400&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/style.css" />
  <link rel="stylesheet" href="/pages.css" />
</head>
<body data-page="products.html">
  <div class="page-hero">
    <img src="/images/hero.jpg" alt="Catalogue Perla" class="page-hero-img" />
    <div class="page-hero-overlay"></div>
    <div class="page-hero-content">
      <div class="page-hero-label">Collections</div>
      <h1>Notre <em>Catalogue</em></h1>
    </div>
  </div>
  <div class="breadcrumb">
    <a href="/index.html">Accueil</a>
    <span class="breadcrumb-sep">›</span>
    <span>Catalogue</span>
  </div>
  <section class="page-section bg-cream">
    <div id="viewLanding">
      <div class="section-label reveal-label"><span class="label-line"></span>Nos Collections</div>
      <h2 class="gender-title" style="margin-bottom:40px;">Choisissez votre <em>univers</em></h2>
      <div class="gender-landing">
        <div class="gender-card" onclick="showGender('Femme')">
          <img src="/images/femme-product1.jpg" alt="Collection Femme" />
          <div class="gender-card-overlay"></div>
          <div class="gender-card-content">
            <span class="gender-card-label">Collection</span>
            <h3 class="gender-card-title">Pour Elle</h3>
            <span class="gender-card-link">Découvrir <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span>
          </div>
        </div>
        <div class="gender-card" onclick="showGender('Homme')">
          <img src="/images/homme-instagram1.jpg" alt="Collection Homme" />
          <div class="gender-card-overlay"></div>
          <div class="gender-card-content">
            <span class="gender-card-label">Collection</span>
            <h3 class="gender-card-title">Pour Lui</h3>
            <span class="gender-card-link">Découvrir <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg></span>
          </div>
        </div>
      </div>
      <div class="filter-bar" style="margin-top:48px;">
        <button class="filter-btn active" data-filter="all" onclick="filterProducts('all', this)">Tous</button>
        <button class="filter-btn" data-filter="Femme" onclick="filterProducts('Femme', this)">Femme</button>
        <button class="filter-btn" data-filter="Homme" onclick="filterProducts('Homme', this)">Homme</button>
        <button class="filter-btn" data-filter="Les deux" onclick="filterProducts('Les deux', this)">Mixte</button>
        <button class="filter-btn" data-filter="Bagues" onclick="filterProducts('Bagues', this)">Bagues</button>
        <button class="filter-btn" data-filter="Colliers" onclick="filterProducts('Colliers', this)">Colliers</button>
        <button class="filter-btn" data-filter="Bracelets" onclick="filterProducts('Bracelets', this)">Bracelets</button>
        <button class="filter-btn" data-filter="Boucles d'oreilles" onclick="filterProducts('Boucles d\'oreilles', this)">Boucles</button>
        <button class="filter-btn" data-filter="Chaîne de pieds" onclick="filterProducts('Chaîne de pieds', this)">Khelkhal</button>
        <button class="filter-btn" data-filter="Ensemble" onclick="filterProducts('Ensemble', this)">Ensemble</button>
        <button class="filter-btn" data-filter="Broches" onclick="filterProducts('Broches', this)">Broches</button>
        <button class="filter-btn" data-filter="Piercings" onclick="filterProducts('Piercings', this)">Piercings</button>
        <button class="filter-btn" data-filter="Manchettes" onclick="filterProducts('Manchettes', this)">Manchettes</button>
      </div>
      <div class="product-grid" id="productGrid"></div>
    </div>
    <div id="viewGender" style="display:none;">
      <button class="back-btn" onclick="showLanding()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 12H5M12 5l-7 7 7 7"/></svg>
        Retour
      </button>
      <h2 class="gender-title" id="genderTitle">Collection <em>Femme</em></h2>
      <div class="category-filter" id="categoryFilter"></div>
      <div class="product-grid" id="genderGrid"></div>
    </div>
  </section>
  <script src="/shared.js"></script>
  <script>
  const SHEETS_API = 'https://script.google.com/macros/s/AKfycbw4A59eT2dvLl8G0rk751Y89-FIWqdrx-Romj5qETWR6Z1i_KIrpeJ-8VkqQ-fH4BOZ/exec';
  const FEMME_CATS = ['Bagues','Colliers','Bracelets',"Boucles d'oreilles",'Manchettes','Chaîne de pieds','Ensemble','Broches','Piercings'];
  const HOMME_CATS = ['Bagues','Colliers','Bracelets'];
  let PRODUCTS = [];
  const params = new URLSearchParams(location.search);
  const urlGenre = params.get('genre');

  function buildCard(p) {
    const div = document.createElement('div');
    div.className = 'product-card' + (p.available ? '' : ' out-of-stock');
    const slug = p.slug || String(p._row || '');
    const productUrl = slug ? '/product.html?slug=' + encodeURIComponent(slug) : (p._row ? '/product.html?row=' + p._row : '#');
    const fallbackImg = p.genre === 'Homme' ? '/images/homme-product6.jpg' : '/images/femme-product1.jpg';
    div.innerHTML = '<div class="product-card-media" onclick="location.href=\'' + productUrl + '\'" style="cursor:pointer">'
      + '<img src="' + (p.image || fallbackImg) + '" alt="' + p.name + '" class="product-card-img" loading="lazy" onerror="this.src=\'' + fallbackImg + '\'"/>'
      + '<div class="product-card-overlay"></div>'
      + (p.badge ? '<span class="product-card-badge">' + p.badge + '</span>' : '')
      + '<div class="product-card-actions">'
      + '<button class="btn-add-cart" onclick="event.stopPropagation();addToCart(event,\'' + slug + '\')">Ajouter au panier</button>'
      + '<a href="' + productUrl + '" class="btn-view-product" onclick="event.stopPropagation()">Voir le produit</a>'
      + '</div></div>'
      + '<div class="product-card-info" onclick="location.href=\'' + productUrl + '\'" style="cursor:pointer">'
      + '<span class="product-card-collection">' + (p.collection || p.category || '') + '</span>'
      + '<div class="product-card-name">' + p.name + '</div>'
      + '<div class="product-card-price">' + (p.material ? p.material + ' | ' : '') + '<strong>' + p.price + '</strong></div>'
      + '</div>';
    return div;
  }

  function addToCart(e, slug) {
    e.stopPropagation();
    const p = PRODUCTS.find(x => (x.slug && x.slug === slug) || String(x._row) === slug);
    if (!p) return;
    window.PerlaCart.add({ slug: p.slug || String(p._row || Date.now()), name: p.name, price: p.price, image: p.image || '', collection: p.collection || '', material: p.material || '' });
  }

  function renderGrid(container, products) {
    container.innerHTML = '';
    if (!products.length) { container.innerHTML = '<p style="color:#aaa;font-size:.88rem;grid-column:1/-1;padding:40px 0;">Aucun bijou trouvé.</p>'; return; }
    products.forEach(p => container.appendChild(buildCard(p)));
  }

  let currentFilter = 'all';
  function filterProducts(filter, btn) {
    currentFilter = filter;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    let filtered = PRODUCTS;
    if (filter === 'Femme') filtered = PRODUCTS.filter(p => p.genre === 'Femme' || p.genre === 'Les deux');
    else if (filter === 'Homme') filtered = PRODUCTS.filter(p => p.genre === 'Homme' || p.genre === 'Les deux');
    else if (filter === 'Les deux') filtered = PRODUCTS.filter(p => p.genre === 'Les deux');
    else if (filter !== 'all') filtered = PRODUCTS.filter(p => p.category === filter);
    renderGrid(document.getElementById('productGrid'), filtered);
  }

  let currentGender = null;
  function showGender(genre) {
    currentGender = genre;
    document.getElementById('viewLanding').style.display = 'none';
    document.getElementById('viewGender').style.display = 'block';
    document.getElementById('genderTitle').innerHTML = 'Collection <em>' + (genre === 'Femme' ? 'Femme' : 'Homme') + '</em>';
    const allowedCats = genre === 'Homme' ? HOMME_CATS : FEMME_CATS;
    const cf = document.getElementById('categoryFilter');
    cf.innerHTML = '<button class="filter-btn active" onclick="filterGender(\'all\', this)">Tout voir</button>'
      + allowedCats.map(c => '<button class="filter-btn" onclick="filterGender(\'' + c.replace(/'/g,"\'") + '\', this)">' + (c === 'Chaîne de pieds' ? 'Khelkhal' : c) + '</button>').join('');
    filterGender('all');
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  function filterGender(cat, btn) {
    document.querySelectorAll('#categoryFilter .filter-btn').forEach(b => b.classList.remove('active'));
    if (btn) btn.classList.add('active');
    let filtered = PRODUCTS.filter(p => p.genre === currentGender || p.genre === 'Les deux');
    if (cat !== 'all') filtered = filtered.filter(p => p.category === cat);
    renderGrid(document.getElementById('genderGrid'), filtered);
  }

  function showLanding() {
    document.getElementById('viewGender').style.display = 'none';
    document.getElementById('viewLanding').style.display = 'block';
    currentGender = null;
  }

  async function loadProductsFromSheets() {
    try {
      const res = await fetch(SHEETS_API + '?action=getProducts');
      const data = await res.json();
      if (Array.isArray(data) && data.length) {
        PRODUCTS = data.map(p => ({
          slug: p.slug || p.name?.toLowerCase().replace(/\s+/g,'-') || String(p._row),
          name: p.name || '', price: p.price ? (String(p.price).includes('MAD') || String(p.price).includes('Dh') ? p.price : p.price + ' MAD') : '0 MAD',
          collection: p.collection || '', category: p.category || '', genre: p.genre || 'Femme',
          material: p.material || '', image: p.image || (p.genre === 'Homme' ? '/images/homme-product6.jpg' : '/images/femme-product1.jpg'),
          available: p.available !== false && p.available !== 'false', badge: p.badge || '', _row: p._row,
        }));
      }
    } catch(e) { console.warn('Sheets error:', e); }
  }

  document.addEventListener('DOMContentLoaded', async () => {
    document.getElementById('productGrid').innerHTML = '<p style="color:#aaa;font-size:.88rem;padding:40px 0;grid-column:1/-1;">Chargement…</p>';
    await loadProductsFromSheets();
    renderGrid(document.getElementById('productGrid'), PRODUCTS);
    if (urlGenre) showGender(urlGenre);
  });
  </script>
</body>
</html>
